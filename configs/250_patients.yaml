project:
  name: BraTS-Dissertation
  seed: 42
data:
  data_dir: data/BraTS2023-Training
  train_split: 200
  val_split: 25
  roi_size: [128, 128, 128]
  batch_size: 2
  num_workers: 4
  num_samples: 4
  cache_dir: data/.cache
model:
  architecture: SegResNet
  spatial_dims: 3
  in_channels: 4
  out_channels: 3
  init_filters: 32
  dropout_prob: 0.1
training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  scheduler: cosine
  loss: DiceCELoss
  loss_params:
    sigmoid: true
    squared_pred: true
    smooth_nr: 1.0e-05
    smooth_dr: 1.0e-05
wandb:
  project: BraTS-Dissertation
  mode: online
paths:
  models_dir: models
  results_dir: results
